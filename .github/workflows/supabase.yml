# Deploys the database migrations and the `api` Edge Function to Supabase.
# Needs repository secrets SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access tokens) and
# SUPABASE_DB_PASSWORD (Project settings → Database). Runs on pushes to main and by hand.
name: Supabase deploy

on:
  push:
    branches: [main]
    paths: ["app/endpoints/**", "app/helpers/**", "app/server/**", "supabase/**", "scripts/**", "package*.json"]
  workflow_dispatch:

concurrency: supabase-deploy

env:
  SUPABASE_PROJECT_REF: gcuzmuztikisxsmkgtbi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:api
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy api function
        run: supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
